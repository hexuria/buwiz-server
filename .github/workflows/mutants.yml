name: Mutants

# Runs on every pull request that touches Rust source, mutating the PR's diff
# from its base, so a missed mutant is fixed before merge rather than turning
# main red after it. It also runs when commits land on main (mutating only the
# lines that push changed) and on demand for any branch (Actions -> Mutants ->
# Run workflow), mutating that branch's diff from main.
# A missed mutant fails the job: add a test, or record a proven-equivalent
# mutant in .cargo/mutants.toml `exclude_re` with a comment saying why.
on:
  pull_request:
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/mutants.toml"
      - ".github/workflows/mutants.yml"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base:
        description: "Mutate the diff from this ref to HEAD (default: origin/main)"
        required: false
        default: ""

# Each push to main mutates only its own diff, so a later push must not
# cancel an earlier one; a newer push to a PR, or a newer manual run on a
# branch, does replace the older one.
concurrency:
  group: mutants-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || github.event_name }}
  cancel-in-progress: true

# Every mutant rebuilds only this crate, so incremental builds and no debug
# info keep each one short.
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 1
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  mutants:
    name: Mutants (shard ${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    # Each shard gets its own database, so the database tests (src/db_tests)
    # check store and application mutants too. Same setup as ci.yml.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: wasi_auth
          POSTGRES_USER: wasi_auth
          POSTGRES_PASSWORD: wasi_auth_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wasi_auth -d wasi_auth"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://wasi_auth:wasi_auth_ci@127.0.0.1:5432/wasi_auth
      AUTH_PUBLIC_BASE_URL: http://127.0.0.1:3000
      AUTH_ROOT_KEY_BASE64: dGVzdC1vbmx5LXJvb3Qta2V5LW5ldmVyLWluLXByb2Q=
      BUWIZ_REQUIRE_DATABASE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: mutants
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - name: Diff to mutate
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ inputs.base }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE" ]; then
            git diff "$BASE" HEAD -- src > pr.diff
          elif [ -n "$PR_BASE" ]; then
            git diff "$PR_BASE"...HEAD -- src > pr.diff
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ -n "$BEFORE" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            git diff "$BEFORE" HEAD -- src > pr.diff
          else
            git diff origin/main...HEAD -- src > pr.diff
          fi
          wc -l pr.diff
      - name: Migrate the test database
        run: cargo run --locked --quiet --no-default-features --features migrate --bin wasi-auth-migrate -- apply
      - name: Mutate changed lines
        run: |
          if [ ! -s pr.diff ]; then echo "No Rust source changes."; exit 0; fi
          cargo mutants --no-shuffle --in-diff pr.diff --shard ${{ matrix.shard }}/8 \
            --features ssr,postgres --cargo-arg=--lib
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-shard-${{ matrix.shard }}
          path: mutants.out
          if-no-files-found: ignore
