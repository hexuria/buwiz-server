name: Mutants

# Slow, so it does not run on every push. It runs when commits land on main
# (mutating only the lines that push changed) or on demand for any branch
# (Actions -> Mutants -> Run workflow), mutating that branch's diff from main.
# A missed mutant fails the job: add a test, or record a proven-equivalent
# mutant in .cargo/mutants.toml `exclude_re` with a comment saying why.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base:
        description: "Mutate the diff from this ref to HEAD (default: origin/main)"
        required: false
        default: ""

concurrency:
  group: mutants-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  mutants:
    name: Mutants (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: mutants
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - name: Diff to mutate
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ inputs.base }}
        run: |
          if [ -n "$BASE" ]; then
            git diff "$BASE" HEAD -- src > pr.diff
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ -n "$BEFORE" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            git diff "$BEFORE" HEAD -- src > pr.diff
          else
            git diff origin/main...HEAD -- src > pr.diff
          fi
          wc -l pr.diff
      - name: Mutate changed lines
        run: |
          if [ ! -s pr.diff ]; then echo "No Rust source changes."; exit 0; fi
          cargo mutants --no-shuffle --in-diff pr.diff --shard ${{ matrix.shard }}/4 \
            --features ssr,postgres --cargo-arg=--lib
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-shard-${{ matrix.shard }}
          path: mutants.out
          if-no-files-found: ignore
