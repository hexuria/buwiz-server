[package]
name = "spin-macro"
version = "6.0.0"
authors = ["Spin Framework Maintainers <cncf-spin-maintainers@lists.cncf.io>"]
edition = "2024"
license = "Apache-2.0 WITH LLVM-exception"
repository = "https://github.com/spinframework/spin-rust-sdk"
rust-version = "1.93"
homepage = "https://spinframework.dev/rust-components"
description = """
Rust procedural macros for Spin and WASIp3
"""

[lib]
name = "spin_macro"
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1.0"
syn = { version = "1.0", features = ["full"] }
